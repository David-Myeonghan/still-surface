<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>고요한 표면 · Still Surface</title>
  <link rel="icon" href="data:," />
  <style>
    html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; }
    #scene { display: block; width: 100vw; height: 100vh; }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #05070d; color: #cdd6ff; font-family: system-ui, sans-serif; }
    #boot button { padding: 14px 28px; font-size: 16px; border: 1px solid #3a4670; background: #1a2036; color: #cdd6ff; border-radius: 10px; cursor: pointer; }
    #boot button:hover { background: #232b48; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="boot"><button id="bootStart">▶ 탐사 시작</button></div>
  <div id="hud" class="hud">
    <div id="progress" class="progress">0 / 7</div>
    <div id="motes" class="motes">✦ <span id="moteCount">0</span></div>
    <div id="compass" class="compass"><div id="needle" class="needle">▲</div><div id="cdist" class="cdist"></div></div>
    <div id="prompt" class="prompt">가까이서 <b>F</b>를 눌러 스캔</div>
    <svg id="ring" class="ring" viewBox="0 0 100 100"><circle class="rbg" cx="50" cy="50" r="44"/><circle id="rfill" class="rfill" cx="50" cy="50" r="44"/></svg>
    <div id="lore" class="lore"></div>
    <div id="ending" class="ending"><h1>APERTURE OPEN</h1><p>침묵의 끝. 하늘이 응답했다.</p></div>
  </div>
  <link rel="stylesheet" href="/src/ui/style.css" />
  <script type="module" src="/src/main.js"></script>
</body>
</html>

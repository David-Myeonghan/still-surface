<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>고요한 표면 · Still Surface</title>
  <link rel="icon" href="data:," />
  <style>
    html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; }
    #scene { display: block; width: 100vw; height: 100vh; }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #05070d; color: #cdd6ff; font-family: system-ui, sans-serif; }
    .boot-inner { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 24px; text-align: center; }
    #boot button { padding: 14px 28px; font-size: 16px; border: 1px solid #3a4670; background: #1a2036; color: #cdd6ff; border-radius: 10px; cursor: pointer; }
    #boot button:hover { background: #232b48; }
    .boot-legend { font-size: 13px; line-height: 1.9; color: #9fb0d8; }
    .boot-legend b { color: #7ff4ff; }
    .boot-goal { margin-top: 6px; color: #cdd6ff; }
    .boot-legend.touch { display: none; }
    @media (pointer: coarse) { .boot-legend.desktop { display: none; } .boot-legend.touch { display: block; } }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="boot">
    <div class="boot-inner">
      <button id="bootStart">▶ 탐사 시작</button>
      <div class="boot-legend desktop">
        <div><b>WASD</b> 이동 · <b>Shift</b> 달리기 · <b>Space</b> 점프</div>
        <div><b>E</b> 대시(모트 소비) · <b>F</b> 홀드 스캔 · 마우스 시선</div>
        <div class="boot-goal">빛기둥(공명체) 7개를 찾아 스캔하세요.</div>
      </div>
      <div class="boot-legend touch">
        <div>왼쪽 드래그 이동 · 오른쪽 드래그 시선</div>
        <div><b>JUMP</b> 점프 · <b>SCAN</b> 홀드 스캔 · <b>DASH</b> 대시</div>
        <div class="boot-goal">빛기둥(공명체) 7개를 찾아 스캔하세요.</div>
      </div>
    </div>
  </div>
  <div id="hud" class="hud">
    <div id="progress" class="progress">0 / 7</div>
    <div id="motes" class="motes">✦ <span id="moteCount">0</span></div>
    <div id="compass" class="compass"><div id="needle" class="needle">▲</div><div id="cdist" class="cdist"></div></div>
    <div id="prompt" class="prompt">가까이서 <b>F</b>를 눌러 스캔</div>
    <svg id="ring" class="ring" viewBox="0 0 100 100"><circle class="rbg" cx="50" cy="50" r="44"/><circle id="rfill" class="rfill" cx="50" cy="50" r="44"/></svg>
    <div id="hint" class="hint"><b>WASD</b> 이동 · <b>Shift</b> 달리기 · <b>Space</b> 점프 · <b>E</b> 대시 · <b>F</b> 스캔</div>
    <div id="lore" class="lore"></div>
    <div id="ending" class="ending">
      <h1>APERTURE OPEN</h1>
      <p>침묵의 끝. 하늘이 응답했다.</p>
      <div id="eStats" class="e-stats"></div>
      <div id="eBtns" class="e-btns">
        <button id="againBtn" class="e-btn">다시 (새 행성)</button>
        <button id="dailyBtn" class="e-btn">오늘의 행성</button>
      </div>
    </div>
  </div>
  <link rel="stylesheet" href="/src/ui/style.css" />
  <script type="module" src="/src/main.js"></script>
</body>
</html>
